name: CI

on:
  push:
    branches: [ home, hw, main ]     
  pull_request:
    branches: [ main ]      

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    - name: Dependencies
      run: go mod download

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test -v -race ./...

    - name: Build
      run: go build -v ./cmd/wm
